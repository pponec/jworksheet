# Builds the installer by running `mvn -Pinstallers package`, which drives
# jpackage through jpackage-maven-plugin. The installer type follows the host:
# deb on Linux, msi on Windows, dmg on macOS.
#
# Runs only after "Java CI with Maven" succeeded, so nothing is packaged from a
# tree whose tests did not pass.
#
# Artifacts expire after one day, which is GitHub's minimum. Every run therefore
# also refreshes a rolling pre-release tagged "latest" that holds exactly one
# file per platform, so the newest MSI / DMG / DEB is always at one URL and older
# builds never pile up.
#
# macOS: the dmg is ad-hoc signed, which is enough to launch it. A downloaded app
# is still marked with com.apple.quarantine, and that flag is attached by the
# browser *after* the download, so no build step can strip it; the user removes
# it once with: xattr -dr com.apple.quarantine /Applications/jWorkSheet.app

name: Package

on:
  workflow_run:
    workflows: ["Java CI with Maven"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  package:
    name: Package (${{ matrix.os }})
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-java@3a3f6e87493236a137f26f731c3b10b423971932 # v4.5.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Bundler prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot rpm

      # jpackage delegates MSI creation to WiX, and only to WiX 3.x.
      - name: Bundler prerequisites (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --version 3.14.1 -y --no-progress
          }

      - name: Package
        shell: bash
        run: mvn -B -Pinstallers package

      - uses: actions/upload-artifact@b4b15b8c7c6ac21eaad8fcf018f27f0992cfb9f1 # v4.6.0
        with:
          name: jworksheet-${{ matrix.os }}
          path: target/dist/*
          retention-days: 1
          if-no-files-found: error

  publish-latest:
    name: Refresh the rolling "latest" release
    needs: [package]
    permissions:
      contents: write
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -lh artifacts
          gh release view latest --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || gh release create latest --repo "$GITHUB_REPOSITORY" \
                 --prerelease --title "Latest build" \
                 --notes "Rolling build of ${{ github.event.workflow_run.head_sha || github.sha }}."
          gh release upload latest artifacts/* --clobber --repo "$GITHUB_REPOSITORY"